server.port=8085

# Load the root .env for direct runs (from the project root or backend directory).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lognex}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lognex}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lognex}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns production schema changes; Hibernate only checks mappings on startup.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.lognex.backend=DEBUG

lognex.generator.rate=100
