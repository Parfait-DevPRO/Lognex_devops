services:
  postgres:
    image: postgres:16-alpine
    container_name: lognex-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lognex}
      POSTGRES_USER: ${POSTGRES_USER:-lognex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lognex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lognex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lognex} -d ${POSTGRES_DB:-lognex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lognex-backend
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lognex}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lognex}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lognex}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      LOGNEX_GENERATOR_RATE: ${LOGNEX_GENERATOR_RATE:-10}
    networks:
      - lognex-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lognex-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lognex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  lognex-network:
    driver: bridge
