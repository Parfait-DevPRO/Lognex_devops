# Replace these placeholders with Supabase credentials. Use a secret manager for deployments.
apiVersion: v1
kind: Secret
metadata:
  name: lognex-secrets
  namespace: lognex
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:postgresql://<SUPABASE_HOST>:<PORT>/postgres?sslmode=require
  SPRING_DATASOURCE_USERNAME: <SUPABASE_USERNAME>
  SPRING_DATASOURCE_PASSWORD: <SUPABASE_DATABASE_PASSWORD>
